name: Release

# A v* tag builds the wheel, writes the hash-locked install file, checks that file installs with
# Casper's exact command on every supported system, then publishes those same files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Tag matches the package version
        shell: bash
        run: |
          version="$(uv run --frozen python -c 'import casper_network_mcp as m; print(m.__version__)')"
          test "v${version}" = "${GITHUB_REF_NAME}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Build
        run: uv build
      - name: Lock file from the built wheel
        run: uv run --frozen python scripts/make_lock.py "$VERSION" --dist dist --out casper-network-mcp.lock.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: lock
          path: casper-network-mcp.lock.txt

  check-lock:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: lock
      - name: Install with Casper's command into an empty environment
        shell: bash
        run: |
          # A Windows venv keeps its programs in Scripts, not bin, and they end in .exe.
          bin="$RUNNER_TEMP/venv/bin" exe=""
          if [ "$RUNNER_OS" = Windows ]; then bin="$RUNNER_TEMP/venv/Scripts" exe=".exe"; fi
          echo "SERVER=$bin/casper-network-mcp$exe" >> "$GITHUB_ENV"
          uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/venv"
          uv pip install --require-hashes --no-deps --only-binary :all: --find-links dist \
            --python "$bin/python$exe" -r casper-network-mcp.lock.txt
      - name: Runs with no logins
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows needs SYSTEMROOT to start Python's socket layer; it holds no login.
            env -i PATH=/usr/bin:/bin SYSTEMROOT="$SYSTEMROOT" USERPROFILE="$RUNNER_TEMP" "$SERVER" --help
          else
            env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" "$SERVER" --help
          fi

  publish:
    needs: [build, check-lock]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  attach-lock:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lock
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Attach the lock file and wheel to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Install with Casper, or: uv pip install --require-hashes --no-deps --only-binary :all: -r casper-network-mcp.lock.txt" \
            casper-network-mcp.lock.txt dist/*
