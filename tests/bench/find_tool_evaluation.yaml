# Fresh synthetic evaluation, not the original 75-question held-out benchmark.
# Freeze this file and record baseline scores BEFORE any router changes.
# Do not inspect its misses or tune against it. It becomes regression data after
# the first final comparison; future tuning needs a new evaluation set.
# Example identifiers are synthetic.
# --- Central ---
- q: "aruba add a notification rule"
  product: central
  expect: [create_notification_rule]
- q: "central remove a webhook"
  product: central
  expect: [delete_webhook]
- q: "central update the saved report name"
  product: central
  expect: [update_report]
- q: "central display the device groups"
  product: central
  expect: [list_device_groups]
- q: "please show the spanning tree topology of the switch"
  product: central
  expect: [get_switch_spanning_tree]
- q: "which clients are connected to this SSID"
  product: central
  expect: [list_ssid_clients, list_clients]
- q: "get a webhook using its id"
  product: central
  expect: [get_webhook]
- q: "list the saved reports"
  product: central
  expect: [list_reports]
- q: "ping a destination from a CX switch"
  product: central
  expect: [cx_ping]
- q: "show the radios on this access point"
  product: central
  expect: [get_ap_radios]
- q: "create a new VLAN"
  product: central
  expect: [create_vlan]
- q: "show the switch port error counters"
  product: central
  expect: [get_switch_port_errors]
